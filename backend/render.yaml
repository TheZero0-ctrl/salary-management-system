databases:
  - name: salary-management-db
    databaseName: salary_management_db_1dm5
    user: salary_management_db_1dm5_user

services:
  - type: web
    name: salary-management-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: FRONTEND_APP_ORIGINS
        sync: false
